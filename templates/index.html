<!DOCTYPE html>
<html>
<head><title>Expense Tracker</title>
<style>
body{font-family:Arial;padding:20px;max-width:600px;margin:auto}
input,button{padding:10px;margin:5px}
.card{border:1px solid #ccc;padding:10px;margin:5px 0}
</style>
</head>
<body>
<h2>My Expense Tracker - by Roshan</h2>
<h3>Total: Rs {{ total }}</h3>
<form action="/add" method="POST">
<input type="text" name="name" placeholder="Kis cheez ka kharcha?" required>
<input type="number" name="amount" placeholder="Amount" required>
<button type="submit">Add Expense</button>
</form>
<hr>
{% for expense in expenses %}
<div class="card">{{ expense.name }} - Rs {{ expense.amount }}</div>
{% endfor %}
</body>
</html>
